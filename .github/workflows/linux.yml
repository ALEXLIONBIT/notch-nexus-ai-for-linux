name: NEXUS per Linux (AppImage)

on:
  push:
    tags: ["linux-v*"]
    branches: ["windows-wear"]
    paths: ["backend/**", "ui/**", "linux/**", "windows/selftest.py", ".github/workflows/linux.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    # Ubuntu 22.04: l'AppImage gira su tutte le distro con glibc 2.35 o più nuova
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.11 come scripts/install.sh: openwakeword recente vuole tflite-runtime, che per il 3.12 non c'è
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Librerie di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libxcb-cursor0 libegl1 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libgl1 libfuse2 xvfb tesseract-ocr

      - name: Costruisci, prova (selftest) e crea l'AppImage
        env:
          PYTHON: python
        run: ./linux/build.sh

      - name: Avvia l'AppImage come farebbe un utente
        run: |
          APP=$(ls linux/dist/NEXUS-*-x86_64.AppImage)
          chmod +x "$APP"
          xvfb-run -a -s "-screen 0 1280x800x24" "$APP" > linux/dist/avvio.txt 2>&1 &
          LOG="$HOME/.local/share/nexus/nexus.log"
          ok=0
          for i in $(seq 1 90); do
            sleep 5
            if [ -f "$LOG" ] && grep -q "NEXUS pronto" "$LOG"; then ok=1; break; fi
          done
          tail -40 "$LOG" || true
          cat linux/dist/avvio.txt | tail -20
          pgrep -f "usr/lib/nexus/NEXUS" >/dev/null || { echo "NEXUS si è chiuso da solo"; exit 1; }
          pkill -f "usr/lib/nexus/NEXUS" || true
          [ "$ok" = 1 ] || { echo "NEXUS non ha scritto 'NEXUS pronto' entro 7 minuti"; exit 1; }
          if grep -q "Traceback" "$LOG"; then echo "errori nel log di NEXUS"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-linux
          path: |
            linux/dist/*.AppImage
            linux/dist/*.json
            linux/dist/*.txt
          if-no-files-found: warn

      - name: Pubblica la release
        if: startsWith(github.ref, 'refs/tags/linux-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#linux-v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" linux/dist/NEXUS-*-x86_64.AppImage --clobber
          else
            gh release create "$TAG" linux/dist/NEXUS-*-x86_64.AppImage --title "NEXUS per Linux $VER (AppImage)" \
              --notes-file linux/RELEASE_NOTES.md --latest=false
          fi
