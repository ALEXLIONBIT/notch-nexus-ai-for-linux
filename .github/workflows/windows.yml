name: NEXUS per Windows

on:
  push:
    tags: ["windows-v*"]
    branches: ["windows-wear"]
    paths: ["backend/**", "ui/**", "windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Costruisci, prova (selftest) e crea l'installer
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python windows\build.py

      - name: Installa in silenzio e avvia NEXUS come farebbe un utente
        shell: pwsh
        run: |
          $setup = Get-ChildItem windows\dist\NEXUS-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/TASKS=desktopicon" -Wait
          $exe = "$env:LOCALAPPDATA\Programs\NEXUS\NEXUS.exe"
          if (!(Test-Path $exe)) { throw "NEXUS.exe non installato" }
          # aspetta che NEXUS sia acceso (al primo avvio scarica Whisper, ~1,6 GB)
          $log = "$env:LOCALAPPDATA\NEXUS\nexus.log"
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep 5
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern "NEXUS pronto" -Quiet)) { $ok = $true; break }
          }
          Start-Sleep 8
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("windows\dist\nexus-avviato.png")
          Get-Content $log -Tail 60
          if (!(Get-Process NEXUS -ErrorAction SilentlyContinue)) { throw "NEXUS si è chiuso da solo" }
          Stop-Process -Name NEXUS -Force
          if (!$ok) { throw "NEXUS non ha scritto 'NEXUS pronto' entro 7 minuti" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-windows
          path: |
            windows/dist/NEXUS-Setup-*.exe
            windows/dist/*.json
            windows/dist/*.png
          if-no-files-found: warn

      - name: Pubblica la release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#windows-v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" windows/dist/NEXUS-Setup-*.exe --clobber
          else
            gh release create "$TAG" windows/dist/NEXUS-Setup-*.exe --title "NEXUS per Windows $VER" \
              --notes-file windows/RELEASE_NOTES.md --latest=false
          fi
